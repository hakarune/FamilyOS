name: Build FamilyOS ISO (amd64)

# The real Step 5 (Development Roadmap.md Phase 4) validation
# mechanism - see iso-builder/live-sdk/README.md. This repo's own
# authoring environment (Android/Termux) can't run live-sdk's
# debootstrap/mksquashfs/isohybrid pipeline at all (proot's
# ptrace-based syscall emulation breaks device-node creation and
# loopback mounts), so `ubuntu-latest`'s real root and real kernel are
# what actually exercises this. Manual trigger available any time via
# workflow_dispatch; also runs automatically on changes to the files
# that feed the build.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "iso-builder/**"
      - "overlays/**"
      - "parental-tools/**"
      - "launcher/**"
      - "graphics/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Devuan's debootstrap (real "daedalus" suite script + keyring)
        run: |
          # Ubuntu's stock debootstrap package has no "daedalus" suite script -
          # debootstrap fails with "No such script:
          # /usr/share/debootstrap/scripts/daedalus" even in --foreign mode,
          # which libdevuansdk's own bootstrap_complete_base() uses (--foreign
          # only defers debootstrap's in-chroot second stage; stage 1 still
          # resolves the suite script on the HOST first - see
          # devuan-build-docs/confirmed-live-sdk.txt). This step is unchanged
          # from the live-build era: the fix is the same regardless of which
          # build tool calls debootstrap. Devuan ships its own debootstrap
          # package (daedalus symlinked to ceres) from pkgmaster.devuan.org;
          # installed here, pinned to Pin-Priority 100 so this repo is never
          # used as an ordinary dependency source for anything else on the
          # runner - only the explicit `-t daedalus` install below draws
          # from it.
          echo 'deb [trusted=yes] http://pkgmaster.devuan.org/merged daedalus main' | sudo tee /etc/apt/sources.list.d/devuan.list
          printf 'Package: *\nPin: origin "pkgmaster.devuan.org"\nPin-Priority: 100\n' | sudo tee /etc/apt/preferences.d/devuan-pin
          sudo apt-get update
          # Bootstrap trust: apt can't verify Devuan's Release file until the
          # Devuan keyring itself is installed, so this one install is
          # deliberately unauthenticated - the same bootstrapping method
          # Devuan's own docs recommend (devuan.org/os/keyring).
          sudo apt-get install -y --allow-unauthenticated devuan-keyring
          # Re-add the source without [trusted=yes] now that the real keyring
          # is installed, so everything from here on is signature-verified.
          echo 'deb http://pkgmaster.devuan.org/merged daedalus main' | sudo tee /etc/apt/sources.list.d/devuan.list
          sudo apt-get update
          sudo apt-get install -y -t daedalus debootstrap
          sudo apt-mark hold debootstrap

      - name: Install live-sdk host dependencies
        run: |
          # live-sdk's own README lists "xorriso squashfs-tools live-boot
          # syslinux-common" as Devuan host requirements. Neither live-boot
          # nor syslinux-common is installed here: nothing in libdevuansdk's
          # source touches a host-side live-boot binary anywhere in
          # build_iso_dist's call path (confirmed by reading
          # zlibs/{bootstrap,helpers,iso} directly) - it only matters
          # inside the target chroot, where libdevuansdk's own
          # iso_prepare_strap installs it unconditionally regardless of
          # blend config. Likewise iso_setup_isolinux (zlibs/iso) copies
          # isolinux.bin/*.c32 from live-sdk's own bundled
          # extra/syslinux/ - never from a host-installed syslinux
          # package. Installing either would add an unused Ubuntu-sourced
          # package for no reason, which is the exact category of thing
          # this rebase exists to get away from. zsh is required to run
          # live-sdk itself.
          sudo apt-get update
          sudo apt-get install -y zsh xorriso squashfs-tools

      - name: Clone Devuan's live-sdk + libdevuansdk (Devuan's real build tooling)
        run: |
          # Pinned to exact commit SHAs - the git-commit equivalent of the
          # SHA256 pinning already used for the debootstrap/live-build .deb
          # files this repo has verified before. Both repos mirror
          # parazyd/live-sdk and parazyd/libdevuansdk; Devuan's own real
          # release archive (files.devuan.org/devuan_daedalus/desktop-live/
          # README_desktop-live.txt: "Built with the Devuan SDK, live-sdk
          # module by jaromil and parazyd") confirms this SDK - not
          # necessarily these exact commits - built the real daedalus ISOs.
          # Full research trail, including the one unresolved gap (the
          # actual daedalus-era blend sources weren't found published
          # anywhere reachable): devuan-build-docs/confirmed-live-sdk.txt.
          git clone https://github.com/devuan/live-sdk.git live-sdk-src
          cd live-sdk-src
          git checkout 4f4b7c25a9ef4fc2fa7378fc338ba7cf0722662d
          # Pulls lib/libdevuansdk at live-sdk's OWN pinned submodule
          # commit (7eb4f578..., an ancestor of libdevuansdk's current
          # HEAD - not re-pinned to that newer HEAD, since live-sdk's own
          # designated pairing is the one actually exercised together;
          # see devuan-build-docs/confirmed-live-sdk.txt for what changed
          # between the two) and that submodule's own nested
          # extra/devuan-keyring submodule.
          git submodule update --init --recursive --checkout
          test "$(git rev-parse HEAD)" = "4f4b7c25a9ef4fc2fa7378fc338ba7cf0722662d"
          test "$(git -C lib/libdevuansdk rev-parse HEAD)" = "7eb4f578833f4b093e224633176a12a214dec300"

      - name: Install the FamilyOS blend into live-sdk
        run: cp -r iso-builder/live-sdk/blends/familyos live-sdk-src/blends/familyos

      - name: Build the FamilyOS ISO with live-sdk
        working-directory: live-sdk-src
        env:
          ARCH: amd64
          # familyos.blend requires this explicitly rather than deriving it
          # from its own location - see iso-builder/live-sdk/README.md and
          # the blend file's own REPO_ROOT comment for why (it no longer
          # lives at a fixed relative depth under this repo once copied
          # into live-sdk's own directory tree).
          FAMILYOS_REPO_ROOT: ${{ github.workspace }}
          # Without this, iso_xorriso_build (libdevuansdk/zlibs/iso, the
          # last function in build_iso_dist's chain) ends with
          # `sudo rm -rf "$workdir"` on a SUCCESSFUL build - deleting
          # tmp/devuan-amd64-build/ (which contains strapdir) before the
          # verify step below ever runs, making every one of its checks
          # fail even when the build itself worked. DEBUG=1 is the
          # mechanism the SDK itself provides to skip that cleanup -
          # caught by an independent critique pass; see
          # devuan-build-docs/confirmed-live-sdk.txt.
          DEBUG: "1"
          # Build-time preseed for the parent account's real login
          # password (see familyos.blend's blend_preinst and
          # devuan-build-docs/confirmed-parent-password-preseed.txt for
          # the full mechanism and why it's safe to pass this way - the
          # value never gets traced/logged anywhere). Sourced from an
          # Actions secret when one is configured, never a literal
          # value here, so a real override is never exposed in this
          # file or in git history.
          #
          # `|| 'FamilyOS'`: if the FAMILYOS_PARENT_PASSWORD repository
          # secret isn't set, this falls back to the same public,
          # documented default familyos.blend itself defaults to (see
          # README's "Default Parent Password" section) - explicit here
          # too, rather than relying solely on the blend's own `:=`
          # default, so a reader of this workflow alone sees the real
          # value CI ships without cross-referencing the blend file.
          # Was previously left empty on purpose (falling back to a
          # locked account) - changed after CI build-log evidence
          # showed that meant every real build shipped with `parent`
          # locked and unauthenticatable, since this secret was never
          # actually populated. See README for the accepted tradeoff.
          FAMILYOS_PARENT_PASSWORD: ${{ secrets.FAMILYOS_PARENT_PASSWORD || 'FamilyOS' }}
        run: |
          set -o pipefail
          # NOT `load devuan familyos daedalus`: live-sdk's own `load()`
          # (in the `sdk` file) looks blend names up in a `blend_map`
          # array that's hardcoded INSIDE that function's body
          # (devuan-desktop-live, devuan-minimal-live, heads, decode) -
          # "familyos" can't be added to it without patching live-sdk's
          # own vendored file, and an unregistered name is a soft failure
          # (`act "No blend specified"`, not `die`), the exact same silent
          # no-blend-loaded trap live-sdk's own README quickstart falls
          # into with `load devuan amd64`. Confirmed by an independent
          # critique pass that caught this in the first draft of this
          # workflow - see devuan-build-docs/confirmed-live-sdk.txt.
          #
          # Rather than patch vendored code to add a blend_map entry, this
          # replicates load()'s actual real work directly against our own
          # known blend path, bypassing the hardcoded lookup entirely:
          # source the devuan os-lib, source our blend, set BLEND=1,
          # compute workdir/strapdir exactly as load() does.
          zsh -f -c '
            source sdk
            os="devuan"
            arch="${ARCH:-amd64}"
            oslib="$R/lib/libdevuansdk/libdevuansdk"
            source "$oslib"
            blendlib="$R/blends/familyos/familyos.blend"
            source "$blendlib"
            export BLEND=1
            workdir="$R/tmp/${os}-${arch}-build"
            strapdir="$workdir/bootstrap"
            mkdir -p "$strapdir"
            export LANG=C
            export LC_ALL=C
            source "$R/lib/zuper/zuper.init"
            build_iso_dist
          ' 2>&1 | tee ../build.log

      - name: Verify boot-critical paths landed as real files, not dangling symlinks
        if: always()
        run: |
          # Requires DEBUG=1 on the build step above: iso_xorriso_build
          # (the last function build_iso_dist calls) unconditionally
          # `rm -rf`s the whole workdir - including strapdir - on success
          # unless DEBUG is set. With it set, the bootstrap tree survives
          # at the same path `load`'s own workdir/strapdir computation
          # produces: $R/tmp/${os}-${arch}-build/bootstrap, with $R
          # defaulting to $PWD at the point `sdk` was sourced
          # (live-sdk-src/, per the working-directory above).
          CHROOT=live-sdk-src/tmp/devuan-amd64-build/bootstrap
          fail=0
          check() {
            if [ -L "$1" ]; then
              echo "FAIL: $1 is a symlink (should be a real file/dir - see iso-builder/live-sdk/README.md's cp -rL note)" >&2
              fail=1
            elif [ ! -e "$1" ]; then
              echo "FAIL: $1 does not exist" >&2
              fail=1
            else
              echo "OK: $1"
            fi
          }
          check "$CHROOT/opt/familyos/launcher/main.py"
          check "$CHROOT/opt/familyos/graphics/branding/familyos-logo.svg"
          check "$CHROOT/usr/local/lib/familyos/parental-tools/familyos-cli"
          check "$CHROOT/etc/inittab"
          check "$CHROOT/etc/resolv.conf"
          exit $fail

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Upload ISO (if produced)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: familyos-amd64-iso
          path: live-sdk-src/dist/*.iso
          if-no-files-found: warn
          retention-days: 14
