name: Build FamilyOS ISO (amd64)

# The real Step 5 (Development Roadmap.md Phase 4) validation
# mechanism - see iso-builder/live-build/README.md. This repo's own
# authoring environment (Android/Termux) can't run live-build's
# debootstrap/mksquashfs/isohybrid pipeline at all (proot's
# ptrace-based syscall emulation breaks device-node creation and
# loopback mounts), so `ubuntu-latest`'s real root and real kernel are
# what actually exercises this. Manual trigger available any time via
# workflow_dispatch; also runs automatically on changes to the files
# that feed the build.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "iso-builder/**"
      - "overlays/**"
      - "parental-tools/**"
      - "launcher/**"
      - "graphics/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Devuan's debootstrap (real "daedalus" suite script + keyring)
        run: |
          # Ubuntu's stock debootstrap package has no "daedalus" suite script -
          # `lb build` fails with "No such script:
          # /usr/share/debootstrap/scripts/daedalus". Devuan ships its own
          # debootstrap package (daedalus symlinked to ceres) from
          # pkgmaster.devuan.org; installed here, pinned to Pin-Priority 100 so
          # this repo is never used as an ordinary dependency source for
          # anything else on the runner - only the explicit `-t daedalus`
          # install below (and later, live-build's own --keyring-packages
          # lookup) draws from it.
          echo 'deb [trusted=yes] http://pkgmaster.devuan.org/merged daedalus main' | sudo tee /etc/apt/sources.list.d/devuan.list
          printf 'Package: *\nPin: origin "pkgmaster.devuan.org"\nPin-Priority: 100\n' | sudo tee /etc/apt/preferences.d/devuan-pin
          sudo apt-get update
          # Bootstrap trust: apt can't verify Devuan's Release file until the
          # Devuan keyring itself is installed, so this one install is
          # deliberately unauthenticated - the same bootstrapping method
          # Devuan's own docs recommend (devuan.org/os/keyring). This also
          # pre-seeds devuan-keyring for live-build's own --keyring-packages
          # fetch during `lb build` (see auto/config).
          sudo apt-get install -y --allow-unauthenticated devuan-keyring
          # Re-add the source without [trusted=yes] now that the real keyring
          # is installed, so everything from here on is signature-verified.
          echo 'deb http://pkgmaster.devuan.org/merged daedalus main' | sudo tee /etc/apt/sources.list.d/devuan.list
          sudo apt-get update
          sudo apt-get install -y -t daedalus debootstrap
          # live-build itself Depends on debootstrap (unversioned or not, it's
          # a real dependency) - hold it so installing live-build next can't
          # have apt silently swap this back for Ubuntu's non-daedalus-aware
          # version to satisfy that dependency.
          sudo apt-mark hold debootstrap

      - name: Install Devuan's live-build (root cause of the Ubuntu-default mismatches)
        run: |
          # Confirmed via deb.devuan.org/merged/dists/daedalus/main/binary-amd64/Packages.gz:
          # Devuan carries its own patched live-build (4.0.3-1+devuan2, pool/DEVUAN,
          # SHA256 48b8a428...9726f) - not a rename, an actual fork ("Branch of
          # live-build 4.0.3 adapted for Devuan", per its changelog).
          #
          # This isn't just about getting a "more correct" package - it's the
          # actual root cause of every Ubuntu-flavored default this workflow has
          # had to individually patch around so far (wrong security mirror, wrong
          # kernel package name, and now casper instead of live-boot). Stock
          # live-build auto-detects a build mode (LB_MODE) from the *build host's*
          # `lsb_release -is` when --mode isn't given - see
          # usr/share/live/build/functions/defaults.sh in this .deb. On
          # ubuntu-latest that resolves to "ubuntu", which is a single switch
          # driving ~20 separate defaults: LB_INITRAMFS (casper vs live-boot),
          # LB_LINUX_PACKAGES (linux vs linux-image), LB_MIRROR_BOOTSTRAP /
          # LB_MIRROR_*_SECURITY (archive.ubuntu.com / security.ubuntu.com),
          # LB_KEYRING_PACKAGES (ubuntu-keyring), LB_ISO_VOLUME, etc. Every fix so
          # far has pinned one of those individually via an explicit `lb config`
          # flag; auto/config now also passes `--mode devuan` directly, which is
          # the mode value this specific Devuan-patched package recognizes (see
          # its defaults.sh: debian, progress-linux, ubuntu, devuan) and which
          # fixes the whole family of defaults at the source instead of one at a
          # time. Ubuntu's stock live-build has no "devuan" case to fall into.
          sudo apt-get update
          sudo apt-get install -y -t daedalus live-build
          # Same reasoning as the debootstrap hold above: live-build has no
          # further reverse-dependents in this job, but hold it anyway so a
          # later `apt-get install`/upgrade in this job can't silently swap it
          # back to Ubuntu's version to resolve some unrelated dependency.
          sudo apt-mark hold live-build

      - name: Install remaining live-build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools mtools dosfstools

      - name: lb config
        working-directory: iso-builder/live-build/amd64
        run: sudo lb config

      - name: lb build
        working-directory: iso-builder/live-build/amd64
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee ../../../build.log

      - name: Verify boot-critical paths landed as real files, not dangling symlinks
        if: always()
        working-directory: iso-builder/live-build/amd64
        run: |
          CHROOT=chroot
          fail=0
          check() {
            if [ -L "$1" ]; then
              echo "FAIL: $1 is a symlink (should be a real file/dir - see README's cp -rL note)" >&2
              fail=1
            elif [ ! -e "$1" ]; then
              echo "FAIL: $1 does not exist" >&2
              fail=1
            else
              echo "OK: $1"
            fi
          }
          check "$CHROOT/opt/familyos/launcher/main.py"
          check "$CHROOT/opt/familyos/graphics/branding/familyos-logo.svg"
          check "$CHROOT/usr/local/lib/familyos/parental-tools/familyos-cli"
          check "$CHROOT/etc/inittab"
          check "$CHROOT/etc/resolv.conf"
          exit $fail

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Upload ISO (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: familyos-amd64-iso
          path: iso-builder/live-build/amd64/live-image-amd64.hybrid.iso
          if-no-files-found: warn
          retention-days: 14
