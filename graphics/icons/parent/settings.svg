<?xml version="1.0" encoding="UTF-8"?>
<!--
FamilyOS parent-anchor icon. Original, hand-authored - not sourced from
either icon pack (see docs/Asset_Sourcing.md), same as
graphics/branding/familyos-logo.svg. Replaces a generic flat Papirus
Material-style icon: this one sits on the TODDLER's own home screen
(the low-profile parent anchor button, per Flavor - Toddler.md), next
to the colorful kid-facing app grid - unlike every other icon in this
directory, which only ever appears inside the already-unlocked,
deliberately plain/adult-styled Parent Panel (see Asset_Sourcing.md's
sourcing split rationale, still valid for those). A flat gray gear
clashed badly with its actual visual neighborhood.

Mark: a cartoonish padlock (bold rounded body, thick rounded shackle)
with a small heart cutout, echoing familyos-logo.svg's own heart motif
so this reads as the same brand family, not an unrelated new icon.
Bold outlines, flat fills, no gradients/shadows - same visual language
as the logo and the kid-facing icon set, kept simple/legible at small
low-profile-anchor sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <path d="M 20 30 L 20 21 A 12 12 0 0 1 44 21 L 44 30"
        fill="none" stroke="#2E7D32" stroke-width="7" stroke-linecap="round"/>
  <rect x="9" y="27" width="46" height="32" rx="10" ry="10"
        fill="#F9A825" stroke="#3E2723" stroke-width="3"/>
  <path d="M 32 51 C 25 44, 19 44, 19 39 C 19 34, 25 32, 32 38
           C 39 32, 45 34, 45 39 C 45 44, 39 44, 32 51 Z"
        fill="#FFFFFF" stroke="#3E2723" stroke-width="2"/>
</svg>
